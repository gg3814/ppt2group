<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>CapstonePPT Test</title>
</head>
<body>
  <!-- ppt 업로드 과목 유추 -->
  <section>
    <h2>1. PPT 업로드 → 과목 유추 → 질문 생성</h2>
    <input type="file" id="pptFile" accept=".ppt,.pptx">
    <button onclick="uploadPPT()">업로드 시작</button>
    <h3>슬라이드/키워드 결과</h3>
    <pre id="pptResult"></pre>
    <h3>과목 유추 결과</h3>
    <pre id="subjectResult"></pre>
  </section>

  <!-- 사용자 수준 테스트 -->
  <section>
    <h2>2. 사용자 수준 테스트</h2>
    <div id="questions"></div>
    <button onclick="submitAnswers()">답변 제출</button>
    <h3>수준 평가 결과</h3>
    <pre id="levelResult"></pre>
    <h3>개념 설명 결과</h3>
    <pre id="explainResult"></pre>
  </section>

  <script>
    let currentSubject = "";
    let currentQuestions = [];

    // PPT 업로드 → analyze → subject → questions
    async function uploadPPT() {
      console.log("uploadPPT 시작");

      const fileInput = document.getElementById("pptFile");
      if (!fileInput.files.length) {
        alert("PPT 파일을 선택하세요.");
        return;
      }
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      // 1) /analyze
      const res = await fetch("/analyze", { method: "POST", body: formData });
      const data = await res.json();
      console.log("analyze 결과:", data);
      document.getElementById("pptResult").textContent =
        JSON.stringify(data, null, 2);

      // 2) 키워드 모으기
      let keywords = [];
      if (data.keywords) {
        for (const slideId in data.keywords) {
          keywords = keywords.concat(data.keywords[slideId]);
        }
      }
      console.log("모은 keywords:", keywords);

      // 3) /subject 호출
      const res2 = await fetch("/subject", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keywords })
      });
      const subjData = await res2.json();
      console.log("subject 응답:", subjData);
      document.getElementById("subjectResult").textContent =
        JSON.stringify(subjData, null, 2);

      // 4) 과목 기반으로 질문 생성
      currentSubject = subjData.answer || "";
      if (currentSubject) {
        await getQuestions(currentSubject);
      }
    }

    // /level/questions → 질문 5개 요청
    async function getQuestions(subject) {
      const res = await fetch("/level/questions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject })
      });
      const data = await res.json();
      console.log("level questions 응답:", data);

      currentQuestions = data.questions;  // 배열 [{question, answer}, ...]

      // UI 렌더링
      const qDiv = document.getElementById("questions");
      qDiv.innerHTML = "<h3>OX 질문</h3>";
      currentQuestions.forEach((qObj, idx) => {
        qDiv.innerHTML += `
          <div>
            <label>${idx + 1}. ${qObj.question}</label><br>
            <input type="radio" name="q${idx}" value="O"> O
            <input type="radio" name="q${idx}" value="X"> X
          </div>
          <br>
        `;
      });
    }

    // 답변 제출 → /level/evaluate → /explain
    async function submitAnswers() {
      const answers = [];
      for (let i = 0; i < currentQuestions.length; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        answers.push(selected ? selected.value : "미응답");
      }

      // 1) 수준 평가
      const res = await fetch("/level/evaluate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subject: currentSubject,
          answers,
          questions: currentQuestions
        })
      });
      const data = await res.json();
      console.log("level evaluate 응답:", data);
      document.getElementById("levelResult").textContent =
        JSON.stringify(data, null, 2);

      // 2) 맞춤 개념 설명
      const res2 = await fetch("/explain", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject: currentSubject, level: data.level })
      });
      const expData = await res2.json();
      console.log("explain 응답:", expData);
      document.getElementById("explainResult").textContent =
        JSON.stringify(expData, null, 2);
    }
  </script>
</body>
</html>
